<!doctype html>
<html lang="de">
    <head>
        <title>Überschrift</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    </head>
    <body>
        <main>
            <div
                style="
                    display: flex;
                    flex-direction: column;
                    align-items: stretch;
                    margin-bottom: 16px;
                "
            >
                <div
                    style="
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                    "
                >
                    <!-- leeres div um links aufzufüllen -->
                    <div style="flex: 1"></div>
                    <h1 style="margin: 0; flex: 1; text-align: center">
                        Coole Überschrift
                    </h1>
                    <div id="login-container" class="login-container">
                        <a
                            href="src/account.html"
                            style="text-decoration: none"
                        >
                            <button type="button" class="login-button">
                                Account
                            </button>
                        </a>
                    </div>
                </div>
            </div>

            <div class="container">
                <a
                    href="src/finds.html"
                    style="text-decoration: none; color: inherit"
                >
                    <div class="button">
                        <span class="icon"></span>
                        <span class="text">Meine Funde</span>
                    </div>
                </a>

                <a
                    href="src/report.html"
                    style="text-decoration: none; color: inherit"
                >
                    <div class="button1">
                        <span class="icon1">+</span>
                        <span class="text1">Neue Meldung</span>
                    </div>
                </a>

                <a
                    href="src/info.html"
                    style="text-decoration: none; color: inherit"
                >
                    <div class="button2">
                        <span class="icon2">i</span>
                        <span class="text2">Info</span>
                    </div>
                </a>
            </div>

            <div class="map-wrapper">
                <div id="map"></div>
                <div class="gradient"></div>
            </div>
        </main>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
