<!doctype html>
<html lang="de">
    <head>
        <title>Überschrift</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    </head>
    <body>
        <main>
            <div
                style="
                    display: flex;
                    flex-direction: column;
                    align-items: stretch;
                    margin-bottom: 16px;
                "
            >
                <div
                    style="
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                    "
                >
                    <!-- leeres div um links aufzufüllen -->
                    <div style="flex: 1"></div>
                    <h1 style="margin: 0; flex: 1; text-align: center">
                        Überschrift
                    </h1>
                    <div id="login-container" class="login-container">
                        <a href="src/info.html" style="text-decoration: none">
                            <button type="button" class="login-button">
                                Info
                                <span
                                    class="mdi mdi-information-slab-circle-outline"
                                ></span>
                            </button>
                        </a>
                        <a
                            href="src/settings.html"
                            style="text-decoration: none"
                        >
                            <button type="button" class="settings-button">
                                Einstellungen
                                <span class="mdi mdi-cog-outline"></span>
                            </button>
                        </a>
                    </div>
                </div>
            </div>

            <div class="container">
                <div id="report-container" class="report-container">
                    <a href="src/report.html" style="text-decoration: none">
                        <button type="button" class="report-button">
                            <span class="mdi mdi-plus" name="report-mdi"></span>
                            <span class="report-text">neue Fund-Meldung</span>
                        </button>
                    </a>
                </div>

                <div class="dings">
                    <div id="finds-container" class="finds-container">
                        <a href="src/finds.html" style="text-decoration: none">
                            <button type="button" class="finds-button">
                                <span
                                    class="mdi mdi-archive-outline"
                                    name="finds-mdi"
                                ></span>
                                <span class="finds-text">meine Funde</span>
                            </button>
                        </a>
                    </div>

                    <div id="account-container" class="account-container">
                        <a
                            href="src/account.html"
                            style="text-decoration: none"
                        >
                            <button type="button" class="account-button">
                                <span
                                    class="mdi mdi-account-outline"
                                    name="account-mdi"
                                ></span>
                                <span class="account-text">Account</span>
                            </button>
                        </a>
                    </div>

                    <div id="info-container" class="info-container">
                        <a href="src/info.html" style="text-decoration: none">
                            <button type="button" class="info-button">
                                <span
                                    class="mdi mdi-information-slab-symbol"
                                    name="info-mdi"
                                ></span>
                                <span class="info-text">Info</span>
                            </button>
                        </a>
                    </div>
                </div>
            </div>

            <div class="map-wrapper">
                <div id="map"></div>
                <div class="gradient"></div>
            </div>
        </main>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
