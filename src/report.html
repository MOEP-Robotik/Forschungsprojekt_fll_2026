<!doctype html>
<html lang="de">
    <head>
        <title>neue Meldung</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    </head>
    <body>
        <a href="/" style="text-decoration: none; color: inherit">
            <span class="mdi mdi-chevron-left"></span>
        </a>
        <form id="report-form">
            <p>Name des Fundes: <span style="color: red">*</span></p>
            <input
                type="text"
                placeholder="Stein"
                id="name"
                name="name"
                maxlength="100"
                required
            />
            <p>Datum des Fundes:</p>
            <input
                type="date"
                placeholder="12.06.2023"
                id="date"
                name="Datum des Fundes"
            />
            <p>
                Beschreibung des/der Fundstücke/s:
                <span style="color: red">*</span>
            </p>
            <textarea
                id="description"
                name="description"
                rows="5"
                maxlength="1000"
                required
            ></textarea>
            <label for="material">Am besten passendes Material:</label>
            <select name="material" id="material">
                <option value="stein">Stein</option>
                <option value="keramik">Keramik</option>
                <option value="metall">Metall</option>
                <option value="holz">Holz</option>
                <option value="glas">Glas</option>

                <option value="textil">Textil</option>
                <option value="leder">Leder</option>

                <option value="knochen">Knochen</option>
                <option value="geweih">Geweih</option>
                <option value="other">etwas anderes</option>
            </select>

            <div class="dimensions">
                <strong>Maße des Fundes:</strong>
                <p>Länge:</p>
                <input type="number" placeholder="25cm" name="length" />
                <p>Breite:</p>
                <input type="number" placeholder="12,5cm" name="width" />
                <p>Höhe:</p>
                <input type="number" placeholder="6,25cm" name="height"" />
                <p>Gewicht:</p>
                <input type="number" placeholder="50kg" name="weight" />
            </div>

            <p>Fotos der/des Fundstücke/s:</p>
            <input type="file" id="image" name="image" />
            <div class="position">
                <strong>Position des Fundes:</strong>
                <p>Längengrad (Longitude): <span style="color: red">*</span></p>
                <input
                    type="text"
                    placeholder="7.557786"
                    id="lng-input"
                    name="longitude"
                    required
                />
                <p>Breitengrad (Latitude): <span style="color: red">*</span></p>
                <input
                    type="text"
                    placeholder="50.9495"
                    id="lat-input"
                    name="latitude"
                    required
                />
            </div>
            <div id="map"></div>
            <br />
            <button type="submit">Senden</button>
        </form>
        <script type="module" src="/src/report.ts"></script>
    </body>
</html>
