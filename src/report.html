<!doctype html>
<html lang="de">
    <head>
        <title>neue Meldung</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    </head>
    <body>
        <a href="/" class="back-link">
            <span class="mdi mdi-chevron-left"></span>
        </a>
        <form id="report-form">
            <div id="guest-fields" style="display: none">
                <p>Vorname: <span class="required-marker">*</span></p>
                <input
                    type="text"
                    placeholder="Max"
                    id="guest-vorname"
                    name="guest-vorname"
                />
                <p>Nachname: <span class="required-marker">*</span></p>
                <input
                    type="text"
                    placeholder="Mustermann"
                    id="guest-nachname"
                    name="guest-nachname"
                />
                <p>E-Mail: <span class="required-marker">*</span></p>
                <input
                    type="email"
                    placeholder="max.mustermann@example.de"
                    id="guest-email"
                    name="guest-email"
                />
                <p>Postleitzahl: <span class="required-marker">*</span></p>
                <input
                    type="text"
                    placeholder="12345"
                    id="guest-plz"
                    name="guest-plz"
                />
                <p>Telefonnummer: <span class="required-marker">*</span></p>
                <input
                    type="text"
                    placeholder="+49 123 4567890"
                    id="guest-telefonnummer"
                    name="guest-telefonnummer"
                />
                <hr />
            </div>
            <p>Datum des Fundes: <span style="color: red">*</span></p>
            <input
                type="date"
                placeholder="12.06.2023"
                id="date"
                name="Datum des Fundes"
                required
            />
            <label for="material"
                >Am besten passendes Material:
                <span style="color: red">*</span></label
            >
            <select name="material" id="material" required>
                <option value="holz">Holz</option>
                <option value="holzkohle">Holzkohle</option>
                <option value="glas">Glas</option>
                <option disabled></option>

                <option value="gestein" class="option-group">Gestein</option>
                <option value="feuerstein">Feuerstein</option>
                <option value="kunststein">Kunststein</option>
                <option value="fossil">Fossil</option>
                <option value="feuerstein">Feuerstein</option>
                <option value="kunststein">Kunststein</option>
                <option value="fossil">Fossil</option>
                <option disabled></option>

                <option value="metall" class="option-group">Metall</option>
                <option value="bronze">Bronze</option>
                <option value="eisen">Eisen</option>
                <option value="blei">Blei</option>
                <option value="gold">Gold</option>
                <option value="silber">Silber</option>
                <option value="bronze">Bronze</option>
                <option value="eisen">Eisen</option>
                <option value="blei">Blei</option>
                <option value="gold">Gold</option>
                <option value="silber">Silber</option>
                <option disabled></option>


                <option value="keramik" class="option-group">Keramik</option>
                <option value="irdenware">Irdenware</option>
                <option value="ziegel">Ziegel</option>
                <option value="steinzeug">Steinzeug</option>
                <option value="porzellan">Porzellan</option>
                <option value="irdenware">Irdenware</option>
                <option value="ziegel">Ziegel</option>
                <option value="steinzeug">Steinzeug</option>
                <option value="porzellan">Porzellan</option>
                <option disabled></option>


                <option value="knochen" class="option-group">Knochen</option>
                <option value="geweih">Geweih</option>
                <option value="zahn">Zahn</option>
                <option value="geweih">Geweih</option>
                <option value="zahn">Zahn</option>
                <option disabled></option>

                <option value="kunststoff" class="option-group">
                    Kunststoff
                </option>
                <option value="textilfaser">Textilfaser</option>
                <option value="papier">Papier</option></select
            ><br />
            <label for="datierung"> Datierung: </label>
            <select name="datierung" id="datierung">
                <option value="unbekannt">Unbekannt</option>
                <option value="geologisch">Geologisch</option>
                <option value="urgeschichte">Urgeschichte</option>
                <option value="steinzeit">Steinzeit</option>
                <option value="paläolithikum">Paläolithikum</option>
                <option value="mesolithikum">Mesolithikum</option>
                <option value="neolithikum">Neolithikum</option>
                <option value="metallzeit">Metallzeit</option>
                <option value="bronzezeit">Bronzezeit</option>
                <option value="eisenzeit">Eisenzeit</option>
                <option value="römischekaiserzeit">Römische Kaiserzeit</option>
                <option value="mittelalter">Mittelalter</option>
                <option value="frühmittelalter">Frühmittelalter</option>
                <option value="hochmittelalter">Hochmittelalter</option>
                <option value="spätmittelalter">Spätmittelalter</option>
                <option value="neuzeit">Neuzeit</option>
            </select>

            <div class="dimensions">
                <strong>Maße des Fundes:</strong>
                <!--Hier irgendwie was zu Einheiten hinzufügen-->
                <p>Länge: <span style="color: red">*</span></p>
                <input
                    type="number"
                    placeholder="25cm"
                    name="length"
                    id="length"
                    min="0"
                    required
                />
                <p>Breite: <span style="color: red">*</span></p>
                <input
                    type="number"
                    placeholder="12,5cm"
                    name="width"
                    id="width"
                    min="0"
                    required
                />
                <p>Höhe: <span style="color: red">*</span></p>
                <input
                    type="number"
                    placeholder="6,25cm"
                    name="height"
                    id="height"
                    min="0"
                    required
                />
                <p>Gewicht: <span style="color: red">*</span></p>
                <input
                    type="number"
                    placeholder="50kg"
                    name="weight"
                    id="weight"
                    min="0"
                    required
                />
            </div>

            <p>Fotos der/des Fundstücke/s: <span style="color: red">*</span></p>
            <input
                type="file"
                id="image"
                name="image"
                multiple
                accept="image/*"
                required
            />
            <div class="position">
                <strong>Position des Fundes:</strong>
                <p>
                    Längengrad (Longitude):
                    <span class="required-marker">*</span>
                </p>
                <input
                    type="text"
                    placeholder="7.557786"
                    id="lng-input"
                    name="longitude"
                    required
                />
                <p>
                    Breitengrad (Latitude):
                    <span class="required-marker">*</span>
                </p>
                <input
                    type="text"
                    placeholder="50.9495"
                    id="lat-input"
                    name="latitude"
                    required
                />
            </div>
            <div id="map"></div>
            <br />
            <button type="submit">Senden</button>
        </form>
        <script type="module" src="/src/report.ts"></script>
    </body>
</html>
