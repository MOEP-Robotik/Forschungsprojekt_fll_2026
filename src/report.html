<!doctype html>
<html lang="de">
    <head>
        <title>neue Meldung</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    </head>
    <body>
        <a href="/" class="back-link">
            <span class="mdi mdi-chevron-left"></span>
        </a>
        <form id="report-form">
            <div id="guest-fields" style="display: none">
                <p>Vorname: <span class="required-marker">*</span></p>
                <input
                    type="text"
                    placeholder="Max"
                    id="guest-vorname"
                    name="guest-vorname"
                />
                <p>Nachname: <span class="required-marker">*</span></p>
                <input
                    type="text"
                    placeholder="Mustermann"
                    id="guest-nachname"
                    name="guest-nachname"
                />
                <p>E-Mail: <span class="required-marker">*</span></p>
                <input
                    type="email"
                    placeholder="max.mustermann@example.de"
                    id="guest-email"
                    name="guest-email"
                />
                <p>Postleitzahl: <span class="required-marker">*</span></p>
                <input
                    type="text"
                    placeholder="12345"
                    id="guest-plz"
                    name="guest-plz"
                />
                <p>Telefonnummer: <span class="required-marker">*</span></p>
                <input
                    type="text"
                    placeholder="+49 123 4567890"
                    id="guest-telefonnummer"
                    name="guest-telefonnummer"
                />
                <hr />
            </div>
            <p>Datum des Fundes: <span style="color: red">*</span></p>
            <input
                type="date"
                placeholder="12.06.2023"
                id="date"
                name="Datum des Fundes"
                required
            />
            <label for="material"
                >Am besten passendes Material:
                <span style="color: red">*</span></label
            >
            <select name="material" id="material" required>
                <option value="stein">Stein</option>
                <option value="keramik">Keramik</option>
                <option value="metall">Metall</option>
                <option value="holz">Holz</option>
                <option value="glas">Glas</option>

                <option value="textil">Textil</option>
                <option value="leder">Leder</option>

                <option value="knochen">Knochen</option>
                <option value="geweih">Geweih</option>
                <option value="other">etwas anderes</option>
            </select>

            <div class="dimensions">
                <strong>Maße des Fundes:</strong>
                <!--Hier irgendwie was zu Einheiten hinzufügen-->
                <p>Länge: <span style="color: red">*</span></p>
                <input
                    type="number"
                    placeholder="25cm"
                    name="length"
                    id="length"
                    min="0"
                    required
                />
                <p>Breite: <span style="color: red">*</span></p>
                <input
                    type="number"
                    placeholder="12,5cm"
                    name="width"
                    id="width"
                    min="0"
                    required
                />
                <p>Höhe: <span style="color: red">*</span></p>
                <input
                    type="number"
                    placeholder="6,25cm"
                    name="height"
                    id="height"
                    min="0"
                    required
                />
                <p>Gewicht: <span style="color: red">*</span></p>
                <input
                    type="number"
                    placeholder="50kg"
                    name="weight"
                    id="weight"
                    min="0"
                    required
                />
            </div>

            <p>Fotos der/des Fundstücke/s: <span style="color: red">*</span></p>
            <input
                type="file"
                id="image"
                name="image"
                multiple
                accept="image/*"
                required
            />
            <div class="position">
                <strong>Position des Fundes:</strong>
                <p>
                    Längengrad (Longitude):
                    <span class="required-marker">*</span>
                </p>
                <input
                    type="text"
                    placeholder="7.557786"
                    id="lng-input"
                    name="longitude"
                    required
                />
                <p>
                    Breitengrad (Latitude):
                    <span class="required-marker">*</span>
                </p>
                <input
                    type="text"
                    placeholder="50.9495"
                    id="lat-input"
                    name="latitude"
                    required
                />
            </div>
            <div id="map"></div>
            <br />
            <label
                ><input type="checkbox" id="readItInput" />Ich habe die
                <a href="/src/datenschutz.html" target="_blank"
                    >Datenschutzerklärung</a
                >
                und die <a href="/src/agb.html" target="_blank">AGB</a> gelesen
                und akzeptiere diese.</label
            >
            <button type="submit">Senden</button>
        </form>
        <script type="module" src="/src/report.ts"></script>
    </body>
</html>
