<!DOCTYPE html>
<html lang="de">
<head>
    <title>Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>
    <a href="/" style="text-decoration: none; color: inherit;">
        <span class="mdi mdi-chevron-left"></span>
    </a>
    <form id="login-form">
        <p>Ihre E-Mail: <span style="color:red;">*</span></p> <input type="email" placeholder="max.mustermann@example.de" id="email" name="email" required>
        <p>Passwort: <span style="color:red;">*</span></p> <input type="text" placeholder="12345678" id="password" name="password" required>
        <br/>
        <button type="submit">Senden</button>
    </form>
    <script type="module" src="/src/login.ts"></script>
</body>
</html>
