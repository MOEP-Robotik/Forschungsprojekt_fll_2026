<!doctype html>
<html lang="de">
    <head>
        <title>Account</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    </head>
    <body>
        <a href="/" class="back-link">
            <span class="mdi mdi-chevron-left"></span>
        </a>
        <div class="center">
            <h1>Account</h1>
        </div>
        <hr />
        <div id="account-wrapper">
            <div id="account-forms" style="display: none">
                <form id="login-form"></form>
                <h4 class="center mb-8" id="register-header">
                    Hast du noch keinen Account?
                </h4>
                <div class="center mb-8">
                    <button
                        onclick="switchLoginMode()"
                        class="quarter-width"
                        id="register-button"
                    >
                        Registrieren
                    </button>
                </div>
                <div class="center" id="login-register-split">
                    <hr class="horizontal-divider" />
                    <div style="margin-top: 4px">
                        <span>oder</span>
                    </div>
                    <hr class="horizontal-divider" />
                </div>
                <br />
                <button>Gastaccount verwenden</button>
            </div>
        </div>
        <script type="module" src="/src/account.ts"></script>
    </body>
</html>
